name: Build and Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SONARPAD_RELEASE_TAG: v0.6.8

jobs:
  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: swatinem/rust-cache@v2

    # --- INIZIO BLOCCO VCPKG (FIXED) ---
    - name: Set VCPKG_ROOT Environment
      # Imposta la root di vcpkg (già presente nell'immagine windows-latest)
      run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
      shell: powershell

    - name: Cache vcpkg (installed + downloads)
      id: vcpkg-cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}\vcpkg_installed
          C:\vcpkg\downloads
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install vcpkg dependencies
      # Se la cache c'è (cache-hit), salta questo passaggio per risparmiare tempo
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      shell: powershell
      run: vcpkg install --triplet x64-windows --x-install-root="${{ github.workspace }}\vcpkg_installed"

    - name: Set FFMPEG_DIR for Rust
      # Collega la build di vcpkg alla variabile che Rust si aspetta
      # Vcpkg in manifest mode installa in vcpkg_installed nella root del progetto
      run: echo "FFMPEG_DIR=${{ github.workspace }}\vcpkg_installed\x64-windows" >> $env:GITHUB_ENV
      shell: powershell
    # --- FINE BLOCCO VCPKG (FIXED) ---

    - name: Format check
      run: cargo fmt --check

    - name: Clippy (advisory)
      run: cargo clippy --all

    - name: Tests
      run: cargo test --all

    - name: Install NSIS and WiX with Retry
      shell: powershell
      run: |
        function Install-WithRetry {
            param([string]$package)
            $maxRetries = 5
            $retryCount = 0
            $completed = $false
            
            while (-not $completed) {
                try {
                    Write-Host "Attempting to install $package (Attempt $($retryCount + 1)/$maxRetries)..."
                    choco install $package -y --no-progress
                    if ($LASTEXITCODE -eq 0) {
                        $completed = $true
                        Write-Host "Successfully installed $package"
                    } else {
                        throw "Exit code $LASTEXITCODE"
                    }
                } catch {
                    $retryCount++
                    Write-Error "Failed to install $package. Error: $_"
                    if ($retryCount -ge $maxRetries) {
                        throw "Failed to install $package after $maxRetries attempts."
                    }
                    Write-Host "Waiting 10 seconds before retrying..."
                    Start-Sleep -Seconds 10
                }
            }
        }
        
        Install-WithRetry "nsis"
        Install-WithRetry "wixtoolset"

    - name: Cache cargo-packager
      id: cache-cargo-packager
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/cargo-packager.exe
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
        key: ${{ runner.os }}-cargo-packager-locked

    - name: Install cargo-packager
      if: steps.cache-cargo-packager.outputs.cache-hit != 'true'
      run: cargo install cargo-packager --locked

    - name: Build Standalone (Release)
      run: cargo build --verbose --release --features standalone

    - name: Prepare Standalone Artifact
      shell: powershell
      run: |
        Copy-Item -Path "target/release/sonarpad.exe" -Destination "target/release/sonarpad-standalone.exe" -Force

    - name: Build (Release)
      run: cargo build --verbose --release

    - name: Download Sentry CLI
      shell: powershell
      run: |
        $cli = "$env:RUNNER_TEMP\\sentry-cli.exe"
        Invoke-WebRequest -Uri "https://downloads.sentry-cdn.com/sentry-cli/latest/sentry-cli-Windows-x86_64.exe" -OutFile $cli
        echo "SENTRY_CLI=$cli" >> $env:GITHUB_ENV

    - name: Upload PDBs to Sentry
      if: env.SENTRY_AUTH_TOKEN != ''
      shell: powershell
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      run: |
        if (-not $env:SENTRY_ORG -or -not $env:SENTRY_PROJECT) {
          Write-Host "Sentry org/project not set; skipping PDB upload."
          exit 0
        }
        $pdbs = Get-ChildItem -Path "target/release" -Recurse -Filter *.pdb
        if ($pdbs.Count -eq 0) {
          Write-Host "No PDBs found; skipping PDB upload."
          exit 0
        }
        & $env:SENTRY_CLI upload-dif --org $env:SENTRY_ORG --project $env:SENTRY_PROJECT --wait $pdbs.FullName

    - name: Package Application (NSIS)
      run: cargo packager --release --formats nsis

    - name: Generate WiX Artifacts
      run: cargo packager --release --formats wix || cmd /c "exit /b 0"

    - name: Package Application (MSI)
      shell: powershell
      run: .\scripts\build_msi.ps1

    - name: List target directory (Debug)
      shell: powershell
      run: Get-ChildItem -Path target/release -Recurse

    - name: Upload Portable (Exe)
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-Portable
        path: target/release/sonarpad.exe

    - name: Upload Standalone (Exe)
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-Standalone
        path: target/release/sonarpad-standalone.exe

    - name: Upload Setup (NSIS)
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-Setup
        path: target/release/*-setup.exe

    - name: Upload Installer (MSI)
      uses: actions/upload-artifact@v4
      with:
        name: Sonarpad-MSI
        path: target/release/*.msi
