name: Build and Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows - ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [portable, standalone, installer]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.variant }}

      # --- INIZIO BLOCCO VCPKG ---
      - name: Set VCPKG_ROOT Environment
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
        shell: powershell

      - name: Vcpkg Cache
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install vcpkg dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: vcpkg install --triplet x64-windows
        shell: cmd

      - name: Set FFMPEG_DIR for Rust
        run: echo "FFMPEG_DIR=${{ github.workspace }}\vcpkg_installed\x64-windows" >> $env:GITHUB_ENV
        shell: powershell
      # --- FINE BLOCCO VCPKG ---

      # (Opzionale) Esegui controlli solo una volta: qui li faccio solo su "installer"
      - name: Format check
        if: matrix.variant == 'installer'
        run: cargo fmt --check

      - name: Clippy (advisory)
        if: matrix.variant == 'installer'
        run: cargo clippy --all

      - name: Tests
        if: matrix.variant == 'installer'
        run: cargo test --all

      # -------------------------
      # BUILD PORTABLE
      # -------------------------
      - name: Build Portable (Release)
        if: matrix.variant == 'portable'
        run: cargo build --verbose --release

      - name: Upload Portable (Exe)
        if: matrix.variant == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: Novapad-Portable
          path: target/release/novapad.exe

      # -------------------------
      # BUILD STANDALONE
      # -------------------------
      - name: Build Standalone (Release)
        if: matrix.variant == 'standalone'
        run: cargo build --verbose --release --features standalone

      - name: Prepare Standalone Artifact
        if: matrix.variant == 'standalone'
        shell: powershell
        run: Copy-Item -Path "target/release/novapad.exe" -Destination "target/release/novapad-standalone.exe" -Force

      - name: Upload Standalone (Exe)
        if: matrix.variant == 'standalone'
        uses: actions/upload-artifact@v4
        with:
          name: Novapad-Standalone
          path: target/release/novapad-standalone.exe

      # -------------------------
      # INSTALLER (BUILD + PACKAGE)
      # -------------------------
      - name: Cache cargo-packager
        if: matrix.variant == 'installer'
        id: cache-cargo-packager
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager.exe
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-packager-locked

      - name: Install cargo-packager
        if: matrix.variant == 'installer' && steps.cache-cargo-packager.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked

      - name: Install NSIS and WiX with Retry
        if: matrix.variant == 'installer'
        shell: powershell
        run: |
          function Install-WithRetry {
              param([string]$package)
              $maxRetries = 5
              $retryCount = 0
              $completed = $false

              while (-not $completed) {
                  try {
                      Write-Host "Attempting to install $package (Attempt $($retryCount + 1)/$maxRetries)..."
                      choco install $package -y --no-progress
                      if ($LASTEXITCODE -eq 0) {
                          $completed = $true
                          Write-Host "Successfully installed $package"
                      } else {
                          throw "Exit code $LASTEXITCODE"
                      }
                  } catch {
                      $retryCount++
                      Write-Error "Failed to install $package. Error: $_"
                      if ($retryCount -ge $maxRetries) {
                          throw "Failed to install $package after $maxRetries attempts."
                      }
                      Write-Host "Waiting 10 seconds before retrying..."
                      Start-Sleep -Seconds 10
                  }
              }
          }

          Install-WithRetry "nsis"
          Install-WithRetry "wixtoolset"

      - name: Build (Release) - Installer
        if: matrix.variant == 'installer'
        run: cargo build --verbose --release

      - name: Package Application (NSIS)
        if: matrix.variant == 'installer'
        run: cargo packager --release --formats nsis

      - name: Generate WiX Artifacts
        if: matrix.variant == 'installer'
        run: cargo packager --release --formats wix || cmd /c "exit /b 0"

      - name: Package Application (MSI)
        if: matrix.variant == 'installer'
        shell: powershell
        run: .\scripts\build_msi.ps1

      - name: List target directory (Debug)
        if: matrix.variant == 'installer'
        shell: powershell
        run: Get-ChildItem -Path target/release -Recurse

      - name: Upload Installer (Setup)
        if: matrix.variant == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: Novapad-Setup
          path: target/release/*-setup.exe

      - name: Upload Installer (MSI)
        if: matrix.variant == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: Novapad-MSI
          path: target/release/*.msi
