[workspace]
members = ["novapad", "platform_windows", "sapi4_bridge"]
default-members = ["novapad"]
resolver = "2"

[profile.dev.package.symphonia]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-format-isomp4]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 3

[profile.dev.package.rodio]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
debug = 0
strip = true
